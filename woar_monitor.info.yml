name: 'WOAR Monitor'
type: module
description: 'Stellt einen tokengeschützten, ausschließlich lesenden JSON-Endpunkt bereit, über den die Monitoring-Zentrale Update-Stand, Versionen und den letzten Cron-Lauf abfragt.'
package: WOAR
# Fassung des Moduls. Die Zentrale erkennt daran veraltete Installationen.
#
# phpcs beanstandet diese Zeile ("wird von drupal.org beim Paketieren ergänzt").
# Das trifft hier nicht zu: Dieses Modul wird von Hand verteilt, es gibt keine
# Paketierung, die eine Version einträgt. Ohne diese Zeile meldet jede Website
# "unversioniert" und ein veralteter Stand fiele nirgends auf.
version: '1.0.0'
core_version_requirement: ^10 || ^11
configure: woar_monitor.settings
dependencies:
  - drupal:update
